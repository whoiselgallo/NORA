<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="glow-pulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="energy-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF8C33" />
    </linearGradient>
    <linearGradient id="turquesa-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00A3BF" />
    </linearGradient>
  </defs>

  <!-- Fondo Dark Tech -->
  <polygon points="50,2 96,25 96,75 50,98 4,75 4,25" fill="#0A0D14" stroke="#FF6B00" stroke-width="2.5" filter="url(#glow-pulse)" />
  
  <!-- Rejilla geométrica interna -->
  <polygon points="50,12 86,30 86,70 50,88 14,70 14,30" fill="#121722" stroke="rgba(255, 255, 255, 0.10)" stroke-width="1" />

  <!-- Monograma TS Tecnológico -->
  <g transform="translate(24, 22)">
    <!-- Letra T -->
    <path d="M4 8 L32 8 M18 8 L18 36" stroke="url(#energy-gradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Letra S estilizada en Aqua Turquesa -->
    <path d="M46 12 C46 8, 38 6, 32 10 C26 14, 26 22, 38 24 C50 26, 48 36, 40 38 C32 40, 24 36, 24 32" fill="none" stroke="url(#turquesa-gradient)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Puntos cuánticos de telemetría -->
  <circle cx="50" cy="18" r="2" fill="#00E5FF" />
  <circle cx="82" cy="50" r="2" fill="#FF6B00" />
  <circle cx="18" cy="50" r="2" fill="#00E5FF" />
</svg>
